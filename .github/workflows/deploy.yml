name: Deploy Daily News Digest

on:
  schedule:
    - cron: '0 6 * * *' # Runs every day at 6:00 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers (if using Playwright)
        if: always()
        run: |
          python -m playwright install --with-deps

      - name: Run News Generation Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python daily_news.py

      - name: Commit and push generated index
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p output data
          git add index.html output/ data/
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected. Committing and pushing to repository..."
            git commit -m "chore: automated daily news digest update [skip ci]" || echo "nothing to commit"
            git push
          else
            echo "No changes to commit — news digest is already up to date for today."
          fi
