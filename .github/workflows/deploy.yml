name: Deploy Daily News Digest

on:
  schedule:
    - cron: '0 6 * * *' # Runs every day at 6:00 AM UTC
  workflow_dispatch:     # Allows manual triggers from GitHub Actions tab

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run News Generation Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python daily_news.py

      - name: Commit and Push Generated Index
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create output and data directories to prevent git add pathspec errors
          mkdir -p output data
          
          git add index.html output/ data/
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected. Committing and pushing to repository..."
            git commit -m "chore: automated daily news digest update [skip ci]"
            git push
          else
            echo "No changes to commit — news digest is already up to date for today."
          fi
